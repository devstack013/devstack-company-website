<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle for modern look -->
  <circle cx="30" cy="30" r="25" fill="url(#gradient1)" opacity="0.1"/>
  
  <!-- Stack symbol with gradient -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B5563;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Stack rectangles with modern styling -->
  <rect x="10" y="20" width="20" height="20" rx="4" fill="url(#gradient1)" transform="rotate(-5 20 30)"/>
  <rect x="20" y="10" width="20" height="20" rx="4" fill="url(#gradient2)" transform="rotate(5 30 20)"/>
  
  <!-- Additional accent rectangle -->
  <rect x="15" y="35" width="15" height="8" rx="2" fill="url(#gradient1)" opacity="0.6"/>
  
  <!-- Company name with gradient text -->
  <text x="60" y="25" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="url(#textGradient)">
    DevStack
  </text>
  
  <!-- Tagline -->
  <text x="60" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#6B7280">
    Technology Solutions
  </text>
</svg>
